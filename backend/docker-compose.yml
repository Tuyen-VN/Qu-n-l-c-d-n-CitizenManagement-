version: '3.8'

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: citizen_db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CitizenPass123!"
    ports:
      - "1434:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "CitizenPass123!", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: citizen_db_init
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./init.sql:/usr/config/init.sql
    entrypoint: >
      /bin/bash -c "
      echo 'SQL Server is healthy! Finding sqlcmd...';
      SQLCMD_BIN='sqlcmd';
      if [ -f /opt/mssql-tools18/bin/sqlcmd ]; then
        SQLCMD_BIN='/opt/mssql-tools18/bin/sqlcmd -C';
      elif [ -f /opt/mssql-tools/bin/sqlcmd ]; then
        SQLCMD_BIN='/opt/mssql-tools/bin/sqlcmd';
      fi;
      echo 'Running initialization script init.sql...';
      $$SQLCMD_BIN -S database -U sa -P 'CitizenPass123!' -i /usr/config/init.sql;
      echo 'Database initialization complete!';
      "

volumes:
  mssql_data:
